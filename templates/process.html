{% extends "base.html" %}

{% block title %}BOM Matcher - Process{% endblock %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/process-page.css') }}">
{% endblock %}

{% block content %}
<div class="match-page">
    <!-- Header: Back, file name and customer left; the five actions right, on one line -->
    <section class="match-head">
        <div class="match-title">
            <a href="/?back=1" class="btn btn-ghost match-back" title="Back to upload and column mapping">{{ icon('back') }}Back</a>
            <span class="match-vsep" aria-hidden="true"></span>
            <h1 class="fx-heading" id="bomName"></h1>
            <span class="fx-badge fx-badge-gold fx-badge-pill klant-pill" id="klantPill" hidden></span>
        </div>
        <div class="match-actions" role="toolbar" aria-label="Match actions">
            <button class="btn" type="button" id="selectMpnfreeBtn" onclick="selectMpnfree()">{{ icon('check') }}Select MPNfree</button>
            <button class="btn btn-primary" type="button" id="findIpnBtn" onclick="findIpn()">{{ icon('search') }}Find IPN</button>
            <span class="match-vsep" aria-hidden="true"></span>
            <button class="btn btn-toggle" type="button" id="copyModeBtn" aria-pressed="false" onclick="toggleCopyMode()">{{ icon('copy') }}<span class="tlabel">Copy: OFF</span></button>
            <button class="btn btn-toggle" type="button" id="deleteModeBtn" aria-pressed="false" onclick="toggleDeleteMode()">{{ icon('trash') }}<span class="tlabel">Delete: OFF</span></button>
            <span class="match-vsep" aria-hidden="true"></span>
            <button class="btn" type="button" id="exportBtn" onclick="exportBom()">{{ icon('export') }}Export</button>
        </div>
    </section>

    <!-- Slim glass filter bar: search, status chips, mode hint -->
    <section class="match-filter fx-glass" aria-label="Search and filter">
        <label class="match-search">
            {{ icon('search') }}
            <input type="search" id="searchInput" placeholder="Search description, MPN, FaberNr or refdes"
                   oninput="filterTable()" aria-label="Search lines" autocomplete="off">
        </label>
        <span class="match-vsep" aria-hidden="true"></span>
        <div class="match-fgroup">
            <span class="match-fgroup-label" id="statusLabel">Status</span>
            <div class="fx-chips" role="group" aria-labelledby="statusLabel" id="statusChips">
                <button class="fx-chip" type="button" aria-pressed="true" data-filter="all">All</button>
                <button class="fx-chip" type="button" aria-pressed="false" data-filter="matched">Matched</button>
                <button class="fx-chip" type="button" aria-pressed="false" data-filter="partial">Partial</button>
                <button class="fx-chip" type="button" aria-pressed="false" data-filter="nomatch">No match</button>
            </div>
        </div>
        <span class="mode-hint" id="modeHint" role="status" hidden><span class="mark" aria-hidden="true"></span><span id="modeText"></span></span>
    </section>

    <!-- One white sheet: customer BOM, ERP match and parameters in one table -->
    <div class="match-sheet" id="matchSheet">
        <table class="match-table" id="matchTable">
            <colgroup id="matchCols"></colgroup>
            <thead id="matchTableHead"></thead>
            <tbody id="matchTableBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/process-params.js') }}"></script>
<script src="{{ url_for('static', filename='js/process.js') }}"></script>
{% endblock %}
