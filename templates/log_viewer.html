<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>{{ log_filename }} - Live log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Faber Huisstijl: Inter + IBM Plex Mono, tokens in faber.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/faber.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 20px 20px;
            box-sizing: border-box;
            min-height: 0;
        }

        .topbar {
            padding: 0 16px 0 22px;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar-title {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            overflow-wrap: anywhere;
        }

        .topbar-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            line-height: 16px;
            color: var(--ink-nav);
        }

        #size {
            font-family: var(--font-mono);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Decor next to the status text; the text carries the meaning */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--ink-muted);
        }

        .status[data-state="live"] .status-dot { background: var(--live); }
        .status[data-state="paused"] .status-dot { background: var(--ink-muted); }
        .status[data-state="missing"] .status-dot { background: var(--warning); }
        .status[data-state="error"] .status-dot { background: var(--danger); }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .toolbar .spacer {
            flex: 1;
        }

        /* Pause / Follow / Clear view: chips, the active one citroen */
        .tb-btn.active {
            background: var(--citroen);
            border-color: var(--citroen);
            color: var(--on-citroen);
        }

        .filter-input {
            height: var(--control-sm);
            padding: 0 12px;
            border: 1px solid var(--line-control);
            border-radius: var(--radius-pill);
            background: var(--surface-glass);
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            width: 260px;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--focus);
            box-shadow: 0 0 0 1px var(--focus);
        }

        .line-count {
            color: var(--ink-muted);
            font-size: 12px;
        }

        /* The log itself: plain white panel (no glass), Plex Mono */
        #log {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 12px 18px 16px;
            background: var(--surface-raised);
            border: 1px solid var(--line-solid);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glass);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--ink);
            white-space: pre-wrap;
            word-break: break-all;
        }

        #log .ln.warn { color: var(--warning); background: var(--warning-soft); }
        #log .ln.err { color: var(--danger); background: var(--danger-soft); }
        #log .ln.hidden { display: none; }

        .notice {
            color: var(--ink-muted);
            font-family: var(--font-sans);
            padding: 12px 0;
        }

        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 14px;
            }

            .filter-input {
                width: 100%;
            }
        }
    </style></head>

<body class="fx-page">
    <div class="fx-mast topbar">
        <span class="fx-mast-brand"><img class="fx-mast-logo" src="{{ url_for('static', filename='img/faber-logo-blue.svg') }}" alt="Faber Electronics" width="69" height="28"><span class="fx-mast-tool">Live log</span><span class="topbar-title">{{ log_filename }}</span></span>
        <div class="topbar-meta">
            <span id="size"></span>
            <span class="status" id="status" data-state="live"><span class="status-dot"></span><span id="statusText">Connecting&hellip;</span></span>
        </div>
    </div>

    <div class="toolbar">
        <button id="btnPause" class="fx-chip tb-btn" type="button">Pause</button>
        <button id="btnFollow" class="fx-chip tb-btn active" type="button" title="Keep scrolled to the newest line">Follow</button>
        <button id="btnClear" class="fx-chip tb-btn" type="button" title="Clear the window (the file is not touched)">Clear view</button>
        <input id="filter" class="filter-input" type="search" placeholder="Filter lines&hellip;" autocomplete="off">
        <span class="spacer"></span>
        <span class="line-count" id="lineCount"></span>
    </div>

    <div id="log"></div>

    <script>
        const LOG_NAME = {{ log_name | tojson }};
        const LOG_FILENAME = {{ log_filename | tojson }};
        const POLL_MS = 1500;
        const MAX_LINES = 5000;
        // A new log record starts with "HH:MM:SS" (or "YYYY-MM-DD" in lines from older versions);
        // other lines (tracebacks) continue the previous record
        const RECORD_START = /^(\d{2}:\d{2}:\d{2}|\d{4}-\d{2}-\d{2}) /;

        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const sizeEl = document.getElementById('size');
        const lineCountEl = document.getElementById('lineCount');
        const btnPause = document.getElementById('btnPause');
        const btnFollow = document.getElementById('btnFollow');
        const filterInput = document.getElementById('filter');

        let offset = -1;          // -1 = load the tail of the file
        let paused = false;
        let follow = true;
        let lastClass = '';       // Level class of the current record, inherited by continuation lines
        let pollTimer = null;
        let inFlight = false;

        function setStatus(state, text) {
            statusEl.dataset.state = state;
            statusText.textContent = text;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function classify(line) {
            if (!RECORD_START.test(line)) return lastClass;
            // Record format: "15:41:56  WARNING  match_api     message"
            // (older versions: "2026-10-27 15:41:56,000 - name - LEVEL - message")
            if (/^\S+  (ERROR|CRITICAL) |^\S+ \S+ - \S+ - (ERROR|CRITICAL) - /.test(line)) lastClass = 'err';
            else if (/^\S+  WARNING |^\S+ \S+ - \S+ - WARNING - /.test(line)) lastClass = 'warn';
            else lastClass = '';
            return lastClass;
        }

        function classifyRaw(line) {
            // stdout/stderr have no record format: tint by keyword only
            if (/Traceback|Error|Exception|CRITICAL/.test(line)) return 'err';
            if (/WARNING|Warning/.test(line)) return 'warn';
            return '';
        }

        function matchesFilter(line) {
            const f = filterInput.value.trim().toLowerCase();
            return !f || line.toLowerCase().includes(f);
        }

        function updateLineCount() {
            const total = logEl.querySelectorAll('.ln').length;
            const hidden = logEl.querySelectorAll('.ln.hidden').length;
            lineCountEl.textContent = hidden ? `${total - hidden} of ${total} lines` : `${total} lines`;
        }

        function scrollToBottom() {
            logEl.scrollTop = logEl.scrollHeight;
        }

        function appendText(text) {
            const lines = text.split('\n');
            if (lines[lines.length - 1] === '') lines.pop();
            if (!lines.length) return;

            logEl.querySelector('.notice')?.remove();
            const frag = document.createDocumentFragment();
            for (const line of lines) {
                const div = document.createElement('div');
                const cls = LOG_NAME === 'server' ? classify(line) : classifyRaw(line);
                div.className = 'ln' + (cls ? ' ' + cls : '') + (matchesFilter(line) ? '' : ' hidden');
                div.textContent = line;
                frag.appendChild(div);
            }
            logEl.appendChild(frag);

            let excess = logEl.querySelectorAll('.ln').length - MAX_LINES;
            while (excess-- > 0) logEl.firstElementChild.remove();

            updateLineCount();
            if (follow) scrollToBottom();
        }

        function showNotice(text) {
            if (logEl.querySelector('.ln')) return;
            logEl.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'notice';
            div.textContent = text;
            logEl.appendChild(div);
        }

        function clearView() {
            logEl.innerHTML = '';
            lastClass = '';
            updateLineCount();
        }

        async function poll() {
            pollTimer = null;
            if (inFlight) return;  // The running poll reschedules itself
            inFlight = true;
            try {
                const resp = await fetch(`/api/logs/${LOG_NAME}/tail?offset=${offset}`, { cache: 'no-store' });
                const data = await resp.json();
                if (!resp.ok || !data.success) throw new Error(data.error || resp.statusText);

                if (data.reset) clearView();
                if (!data.exists) {
                    offset = -1;
                    sizeEl.textContent = '';
                    setStatus('missing', 'File not found');
                    showNotice(`${LOG_FILENAME} does not exist (yet). It is only written when the app runs as a Windows service. Waiting…`);
                } else {
                    offset = data.offset;
                    sizeEl.textContent = formatSize(data.size);
                    if (!paused) setStatus('live', 'Live');
                    appendText(data.text);
                    if (!logEl.querySelector('.ln')) showNotice('The log is empty. Waiting for new lines…');
                }
            } catch (err) {
                setStatus('error', 'Connection lost. Retrying');
            }
            inFlight = false;
            schedule();
        }

        function schedule() {
            if (!paused && !pollTimer) pollTimer = setTimeout(poll, POLL_MS);
        }

        btnPause.addEventListener('click', () => {
            paused = !paused;
            btnPause.textContent = paused ? 'Resume' : 'Pause';
            btnPause.classList.toggle('active', paused);
            if (paused) {
                clearTimeout(pollTimer);
                pollTimer = null;
                setStatus('paused', 'Paused');
            } else {
                poll();  // Continues from the last offset, so nothing is missed
            }
        });

        function setFollow(on) {
            follow = on;
            btnFollow.classList.toggle('active', on);
            if (on) scrollToBottom();
        }

        btnFollow.addEventListener('click', () => setFollow(!follow));

        // Scrolling up stops following; scrolling back to the bottom resumes it
        logEl.addEventListener('scroll', () => {
            const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 20;
            if (atBottom !== follow) setFollow(atBottom);
        });

        document.getElementById('btnClear').addEventListener('click', clearView);

        filterInput.addEventListener('input', () => {
            logEl.querySelectorAll('.ln').forEach(div => {
                div.classList.toggle('hidden', !matchesFilter(div.textContent));
            });
            updateLineCount();
            if (follow) scrollToBottom();
        });

        poll();
    </script>
</body>

</html>
